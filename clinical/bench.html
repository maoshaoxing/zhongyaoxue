<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方药研习台</title>
  <link rel="icon" href="../icons/icon-96x96.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bench.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>方药研习台</h1>
        <p>《中国药典》2025 年版一部 · 组方配伍自查 · 学习用</p>
        <p class="header-nav"><a href="../index.html">← 首页</a><span class="sep">·</span><a href="./index.html">药典检索</a></p>
      </div>
      <div id="status" class="status">正在加载药典数据</div>
    </header>

    <section class="search-panel">
      <input id="med-input" type="search" placeholder="输入药材名加入药盘，支持俗名（全虫、田七、国老）" autocomplete="off">
      <div id="suggest" class="suggest"></div>
      <div id="tray" class="tray">
        <span class="tray-hint">药盘为空 · 选 2 味以上可查配伍禁忌</span>
      </div>
    </section>

    <section id="board" class="board"></section>

    <footer class="disclaimer">
      数据来源：2025 年版《中国药典》一部。本工具用于学习与复习，展示的是药典法定条文，<strong>不构成处方、不构成用药建议</strong>。剂量与炮制受个体、证候、配伍影响，实际用药须由执业医师决定。
    </footer>
  </main>

  <aside id="detail" class="detail" aria-hidden="true">
    <div class="detail-backdrop" data-close></div>
    <div class="detail-panel">
      <header class="detail-header">
        <div>
          <h2 id="detail-title"></h2>
          <div id="detail-meta" class="detail-meta"></div>
        </div>
        <button class="close" data-close>关闭</button>
      </header>
      <article id="detail-body" class="detail-body"></article>
    </div>
  </aside>

  <script src="bench.js"></script>
  <script src="rpc.js"></script>
  <script src="agent.js"></script>
</body>
</html>

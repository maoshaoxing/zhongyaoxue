<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>药典检索</title>
  <link rel="icon" href="../icons/icon-96x96.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>药典检索</h1>
        <p>《中国药典》2025 年版一部 · 药材 · 提取物 · 成方制剂</p>
        <p class="header-nav"><a href="../index.html">← 首页</a><span class="sep">·</span><a href="./bench.html">方药研习台</a></p>
      </div>
      <div id="status" class="status">正在加载药典数据</div>
    </header>

    <section class="search-panel">
      <input id="search" type="search" placeholder="搜索药名、拼音、俗名、拉丁名、功能主治或正文" autocomplete="off">
      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">全部</button>
        <button class="filter" data-filter="herb">药材饮片</button>
        <button class="filter" data-filter="extract">提取物</button>
        <button class="filter" data-filter="formula">成方制剂</button>
        <button class="filter" data-filter="mastery">教材掌握</button>
      </div>
    </section>

    <section id="results" class="results"></section>

    <footer class="disclaimer">
      数据来源：2025 年版《中国药典》一部。本工具仅供学习与研究，不作为处方或用药依据；涉及剂量、毒性与禁忌请以法定标准和临床医师判断为准。
    </footer>
  </main>

  <aside id="detail" class="detail" aria-hidden="true">
    <div class="detail-backdrop" data-close></div>
    <div class="detail-panel">
      <header class="detail-header">
        <div>
          <h2 id="detail-title"></h2>
          <div id="detail-meta" class="detail-meta"></div>
        </div>
        <button class="close" data-close>关闭</button>
      </header>
      <article id="detail-body" class="detail-body"></article>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>

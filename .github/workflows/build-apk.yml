name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'app.js'
      - 'data.js'
      - 'songs.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'clinical/**'
      - 'clinical_reference.html'
      - 'data/**'
      - 'icons/**'
      - 'scripts/build-site.mjs'
      - 'scripts/build_bench.mjs'
      - 'scripts/build_teaching.mjs'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 与网页端共用同一份构建产物，保证 APK 里的页面和线上一致
      - name: Build web assets
        run: node scripts/build-site.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 由 setup-gradle 提供 gradle 命令与依赖缓存，不再每次生成 wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 整个 dist/ 打进 assets，APK 里 index.html → clinical/ → data/ 都能打开
      - name: Copy web assets into APK
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/. android/app/src/main/assets/
          ls android/app/src/main/assets

      # 有正式签名密钥就用正式包，没有就退化成 debug 签名（可安装、可自用，但不能上架升级）
      - name: Detect signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "使用仓库 Secrets 中的正式密钥签名"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次构建 debug 签名 APK（无法覆盖升级已发布的正式包）"
          fi

      - name: Build release APK
        if: steps.signing.outputs.mode == 'release'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PstoreFile="$KEYSTORE_PATH" \
            -PstorePassword="$STORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Build debug APK
        if: steps.signing.outputs.mode != 'release'
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhongyao-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

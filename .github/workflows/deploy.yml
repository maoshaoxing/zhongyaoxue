name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'app.js'
      - 'data.js'
      - 'songs.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'clinical/**'
      - 'clinical_reference.html'
      - 'data/**'
      - 'icons/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 连续推送时只保留最新一次部署，避免多个 Pages 部署并发
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只把真正的站点文件组装到 dist/，不部署 android/、docs/、scripts/ 等
      - name: Build site
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
